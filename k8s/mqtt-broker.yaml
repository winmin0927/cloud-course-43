apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-svc
spec:
  selector:
    app: mosquitto
  ports:
  - port: 1883
    targetPort: 1883
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-lb
  annotations:
    kubernetes.io/elb.class: union
    kubernetes.io/elb.id: "e2c4edcf-5848-41a0-b9dc-a74431c9a6b3"
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
  - port: 1883
    targetPort: 1883