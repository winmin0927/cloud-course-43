apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: swr.cn-east-3.myhuaweicloud.com/team43/frontend:v1   # 替换为你的镜像
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf     # 使用 subPath 避免覆盖整个目录
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config