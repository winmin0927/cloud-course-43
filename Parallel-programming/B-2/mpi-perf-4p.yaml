apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: mpi-perf-4p
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          imagePullSecrets:
          - name: default-secret
          containers:
          - name: launcher
            image: swr.cn-east-3.myhuaweicloud.com/team43/mpi4py:latest
            command:
            - mpirun
            - -n
            - "4"
            - python
            - /opt/mpi/matrix_perf.py
            - --N
            - "1200"
            - --repeat
            - "3"
            volumeMounts:
            - name: code
              mountPath: /opt/mpi/matrix_perf.py
              subPath: matrix_perf.py
          volumes:
          - name: code
            configMap:
              name: matrix-mul-code
    Worker:
      replicas: 4
      template:
        spec:
          imagePullSecrets:
          - name: default-secret
          containers:
          - name: worker
            image: swr.cn-east-3.myhuaweicloud.com/team43/mpi4py:latest
            resources:
              requests:
                cpu: "1"
                memory: "1Gi"