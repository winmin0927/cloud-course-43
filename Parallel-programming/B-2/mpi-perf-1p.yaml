apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: mpi-perf-1p
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          imagePullSecrets:
          - name: default-secret
          containers:
          - name: launcher
            image: swr.cn-east-3.myhuaweicloud.com/team43/mpi4py:latest
            command:
            - mpirun
            - -n
            - "1"
            - python
            - /opt/mpi/matrix_perf.py
            - --N
            - "1200"
            - --repeat
            - "3"
            volumeMounts:
            - name: code
              mountPath: /opt/mpi/matrix_perf.py
              subPath: matrix_perf.py
          volumes:
          - name: code
            configMap:
              name: matrix-mul-code
    Worker:
      replicas: 1                         # 必须 ≥1
      template:
        spec:
          imagePullSecrets:
          - name: default-secret
          containers:
          - name: worker
            image: swr.cn-east-3.myhuaweicloud.com/team43/mpi4py:latest
            command: ["python", "-c", "import time; time.sleep(3600)"]   # 占位，不参与 MPI
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"