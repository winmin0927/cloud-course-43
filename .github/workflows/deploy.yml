name: CI/CD Pipeline to Huawei CCE

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

env:
  REGION: ${{ secrets.SWR_REGION }}
  SWR_ORG: team43

jobs:
  # Job 1: 构建并推送镜像
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify secrets (optional)
        run: |
          if [ -z "${{ secrets.SWR_USERNAME }}" ]; then echo "SWR_USERNAME missing"; exit 1; fi
          if [ -z "${{ secrets.SWR_PASSWORD }}" ]; then echo "SWR_PASSWORD missing"; exit 1; fi
          if [ -z "${{ secrets.SWR_REGION }}" ]; then echo "SWR_REGION missing"; exit 1; fi

      - name: Login to Huawei SWR
        run: |
          docker login -u "${{ secrets.SWR_USERNAME }}" -p "${{ secrets.SWR_PASSWORD }}" \
            "swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v6   # 使用最新稳定版
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: |
            swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/backend:latest
            swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/frontend:latest
            swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: 部署到 CCE（依赖构建成功）
  deploy-to-cce:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag in deployment files
        run: |
          # 使用更精确的正则替换（匹配 swr.cn-xxx/team43/backend:任意tag）
          sed -i "s|\(image: swr\.[^/]*/${{ env.SWR_ORG }}/backend:\)[^ ]*|\1${{ github.sha }}|" k8s/deployment.yaml
          sed -i "s|\(image: swr\.[^/]*/${{ env.SWR_ORG }}/frontend:\)[^ ]*|\1${{ github.sha }}|" k8s/deployment.yaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.27'   # 指定具体版本，避免“latest”可能的不稳定

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to CCE
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          # 滚动重启确保 Pod 使用新镜像
          kubectl rollout restart deployment backend frontend || true
          # 等待部署完成
          kubectl rollout status deployment backend --timeout=3m
          kubectl rollout status deployment frontend --timeout=3m