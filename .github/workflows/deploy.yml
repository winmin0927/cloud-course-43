name: CI/CD Pipeline to Huawei CCE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGION: ${{ secrets.SWR_REGION }}
  SWR_ORG: team43

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login to Huawei SWR
      run: |
        docker login -u ${{ secrets.SWR_USERNAME }} -p ${{ secrets.SWR_PASSWORD }} \
          swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com

    - name: Build and push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.backend
        push: true
        tags: |
          swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/backend:latest
          swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/backend:${{ github.sha }}

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.frontend
        push: true
        tags: |
          swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/frontend:latest
          swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/frontend:${{ github.sha }}

    - name: Update image tag in deployment
      run: |
        sed -i "s|image: .*/backend:.*|image: swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/backend:${{ github.sha }}|" k8s/deployment.yaml
        sed -i "s|image: .*/frontend:.*|image: swr.${{ secrets.SWR_REGION }}.myhuaweicloud.com/${{ env.SWR_ORG }}/frontend:${{ github.sha }}|" k8s/deployment.yaml

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Set kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

    - name: Deploy to CCE
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl rollout restart deployment backend frontend || true
